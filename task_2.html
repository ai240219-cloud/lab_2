<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conference Registration Form</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #eef2f7;
            margin: 0;
            padding: 30px 15px;
        }
        .container {
            max-width: 650px;
            margin: auto;
            background-color: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 3px 12px #cccccc;
        }
        h1 {
            text-align: center;
            color: #17365d;
        }
        p {
            text-align: center;
            color: #555;
        }
        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }
        input, select, textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            margin-top: 6px;
            border: 1px solid #aaa;
            border-radius: 5px;
        }
        .option {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin: 10px 15px 0 0;
            font-weight: normal;
        }
        .option input {
            width: auto;
            margin: 0;
        }
        button {
            width: 100%;
            padding: 12px;
            margin-top: 22px;
            background-color: #17365d;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #285a8e;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Conference Registration</h1>
        <p>Please complete the form to register for the conference.</p>
        <form action="#" method="get">
            <label for="fullname">Full Name *</label>
            <input type="text" id="fullname" name="fullname"
                   placeholder="Enter your full name" required>

            <label for="email">Email Address *</label>
            <input type="email" id="email" name="email"
                   placeholder="example@email.com" required>

            <label for="age">Age *</label>
            <input type="number" id="age" name="age"
                   min="18" max="99"
                   placeholder="Enter your age" required>

            <label>Gender</label>
            <label class="option">
                <input type="radio" name="gender" value="Male"> Male
            </label>
            <label class="option">
                <input type="radio" name="gender" value="Female"> Female
            </label>
            <label class="option">
                <input type="radio" name="gender" value="Other"> Other
            </label>

            <label for="country">Country</label>
            <select id="country" name="country">
                <option value="">Select your country</option>
                <option value="Bangladesh">Bangladesh</option>
                <option value="Malaysia">Malaysia</option>
                <option value="Other">Other</option>
            </select>

            <label for="conference">Conference Session</label>
            <select id="conference" name="conference">
                <option value="">Select a session</option>
                <option value="Web Development">Web Development</option>
                <option value="Cybersecurity">Cybersecurity</option>
                <option value="Artificial Intelligence">Artificial Intelligence</option>
                <option value="Cloud Computing">Cloud Computing</option>
            </select>

            <label for="comments">Additional Comments</label>
            <textarea id="comments" name="comments" rows="4"
                      placeholder="Write your comments here"></textarea>

            <label class="option">
                <input type="checkbox" name="newsletter" value="yes">
                Subscribe to conference updates
            </label>

            <button type="submit">Register Now</button>
        </form>
    </div>
</body>
</html>
